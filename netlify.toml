[build]
  # Security tests run first: if one fails, the deploy stops and the live site stays as it was
  command = "npm test && npm run build"
  publish = "dist"

# Same Node version on every deploy (Vite needs 20.19+)
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Landlord's first sign-in runs as a Netlify Function (no Express server needed on the live site).
# Must come BEFORE the catch-all below.
[[redirects]]
  from = "/api/auth/first-login"
  to = "/.netlify/functions/first-login"
  status = 200
  force = true

# Sign in with a phone number instead of an email (Netlify Function)
[[redirects]]
  from = "/api/auth/phone-sign-in"
  to = "/.netlify/functions/phone-sign-in"
  status = 200
  force = true

# Tenants without a smartphone → app access, and their first-sign-in setup (Netlify Function)
[[redirects]]
  from = "/api/landlord/*"
  to = "/.netlify/functions/tenant-account/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/complete-tenant"
  to = "/.netlify/functions/tenant-account/complete-tenant"
  status = 200
  force = true

# Main admin: register / edit / suspend / delete landlords (Netlify Function)
[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin/:splat"
  status = 200
  force = true

# Sign up with an emailed verification code (Netlify Function)
[[redirects]]
  from = "/api/signup/*"
  to = "/.netlify/functions/signup/:splat"
  status = 200
  force = true

# Forgot password: the app emails the reset link (Netlify Function)
[[redirects]]
  from = "/api/password/*"
  to = "/.netlify/functions/password/:splat"
  status = 200
  force = true

# Landlords and the main admin: delete a message from their own inbox (Netlify Function)
[[redirects]]
  from = "/api/inbox/*"
  to = "/.netlify/functions/inbox/:splat"
  status = 200
  force = true

# Opens the one-time links landlords send on WhatsApp (Netlify Function)
[[redirects]]
  from = "/api/invite/*"
  to = "/.netlify/functions/invite/:splat"
  status = 200
  force = true

# Never serve project source files (the build itself has no source maps: see vite.config.js)
[[redirects]]
  from = "/src/*"
  to = "/index.html"
  status = 404
  force = true

# Shared links: these pages have their own title, words and picture (scripts/linkPreviews.js); same app inside
[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/i/*"
  to = "/i.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

[[redirects]]
  from = "/forgot-password"
  to = "/forgot-password.html"
  status = 200

[[redirects]]
  from = "/reset-password"
  to = "/reset-password.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/delete-account"
  to = "/delete-account.html"
  status = 200

# Vue Router uses history mode: send every unknown path to index.html
# so refreshing or opening a deep link (e.g. /login) doesn't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers on every page ──
# CSP: scripts only from this site (no inline scripts, no eval), data only to this site + Supabase,
# fonts from Google Fonts, the page can't be framed (clickjacking). 'unsafe-inline' for STYLES only
# (Vue sets inline styles); inline scripts stay blocked.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# The service worker and manifest must never be served from an old cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"